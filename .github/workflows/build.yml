name: build installer.pkg (fork, file-replace)

# 源码已直接替换为优化后的 10 个 Swift 文件（含 issue #207 修复），
# 本工作流不含任何补丁步骤，只负责构建。
# 使用：Run workflow → 填 version → 等待 → Releases 下载 FireInstaller.pkg

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (如 v0.32.2-fscarmen-perf)"
        required: true
        type: string
      ref:
        description: "分支 / tag (默认 master)"
        required: false
        type: string
        default: "master"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      USE_CODE_SIGN: "disable"
      NEXT_VERSION: ${{ inputs.version }}
      BUILD_VERSION: ${{ inputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ inputs.ref }}

      - name: prepare sqlcipher
        run: ./scripts/0_prepare_sqlcipher.sh

      - name: build Fire.app (unsigned)
        run: ./scripts/a_build_app.sh

      - name: build FireInstaller.pkg (unsigned)
        run: ./scripts/b_build_installer.sh

      - name: gather artifacts
        run: |
          mkdir -p ./dist-out
          cp ./dist/FireInstaller.pkg ./dist-out/
          cp ./Fire/Info.plist ./dist-out/Info.plist
          ls -la ./dist-out/

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FireInstaller-${{ inputs.version }}-unsigned
          path: ./dist-out/
          retention-days: 30

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Fire ${{ inputs.version }} (fork build, unsigned, perf)
          body: |
            自编译版本：源码直接替换，包含 issue #207 修复 + 上屏性能优化
            （IMK IPC 削减、标点光标回移 300ms→120ms、SQLite 覆盖索引/缓存优化等）。
            无签名无公证，安装后如被 Gatekeeper 拦截：
            `sudo xattr -d -r com.apple.quarantine "/Library/Input Methods/Fire.app"`
          files: |
            ./dist-out/FireInstaller.pkg
